name: Scheduled Check-In Bot

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
      PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
      INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Check-In Bot
        run: python main.py

      - name: Commit Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact/
          git commit -m "Automated collection of instructor posts" || echo "No changes to commit"
          git push
